services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: session-analysis-ch
    hostname: session-analysis-ch
    environment:
      CLICKHOUSE_PASSWORD: "${LOCAL_CH_PASSWORD:-local-dev-only}"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  ch-data:
